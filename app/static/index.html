<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transaction history</title>
    <style>
      :root {
        --bg: #f4efe6;
        --ink: #1c1915;
        --muted: #6b645a;
        --line: #d9d0c3;
        --card: #fffdf8;
        --processing: #8a5a12;
        --processing-bg: #f6e6c8;
        --processed: #1f6b45;
        --processed-bg: #d7efe3;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Source Serif 4", Georgia, serif;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        padding: 2rem 1.5rem 1rem;
        max-width: 1100px;
        margin: 0 auto;
      }
      h1 { margin: 0 0 0.35rem; font-size: 1.75rem; letter-spacing: -0.02em; }
      p.lede { margin: 0; color: var(--muted); font-size: 0.98rem; }
      main { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem 3rem; }
      .layout { display: grid; gap: 1.25rem; }
      @media (min-width: 900px) {
        .layout { grid-template-columns: 320px 1fr; align-items: start; }
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1.1rem 1.15rem;
      }
      label { display: block; font-size: 0.78rem; color: var(--muted); margin: 0.7rem 0 0.25rem; }
      input {
        width: 100%;
        padding: 0.55rem 0.65rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
        background: #fff;
      }
      button {
        margin-top: 1rem;
        width: 100%;
        padding: 0.65rem;
        border: 0;
        border-radius: 8px;
        background: var(--ink);
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: wait; }
      .hint { margin: 0.6rem 0 0; color: var(--muted); font-size: 0.82rem; }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }
      .count { color: var(--muted); font-size: 0.85rem; }
      table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
      th, td { text-align: left; padding: 0.65rem 0.4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
      .mono { font-family: ui-monospace, Consolas, monospace; font-size: 0.82rem; }
      .badge {
        display: inline-block;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .PROCESSING { background: var(--processing-bg); color: var(--processing); }
      .PROCESSED { background: var(--processed-bg); color: var(--processed); }
      .empty { color: var(--muted); padding: 1.5rem 0; }
      .error { color: #8b1e1e; font-size: 0.85rem; margin-top: 0.5rem; }
    </style>
  </head>
  <body>
    <header>
      <h1>Transaction history</h1>
      <p class="lede">Webhook ingest log. New rows start as PROCESSING and flip to PROCESSED after the delay.</p>
    </header>
    <main class="layout">
      <form class="card" id="ingest">
        <strong>Send webhook</strong>
        <label for="transaction_id">Transaction ID</label>
        <input id="transaction_id" name="transaction_id" required />
        <label for="source_account">Source account</label>
        <input id="source_account" name="source_account" value="acc_user_789" required />
        <label for="destination_account">Destination account</label>
        <input id="destination_account" name="destination_account" value="acc_merchant_456" required />
        <label for="amount">Amount</label>
        <input id="amount" name="amount" type="number" step="0.01" value="1500" required />
        <label for="currency">Currency</label>
        <input id="currency" name="currency" value="INR" required />
        <button type="submit">Accept payment event</button>
        <p class="hint">Same ID posted twice still returns 202 and keeps a single row.</p>
        <p class="error" id="form-error" hidden></p>
      </form>
      <section class="card">
        <div class="toolbar">
          <strong>History</strong>
          <span class="count" id="count">Loading…</span>
        </div>
        <div id="table-wrap"></div>
      </section>
    </main>
    <script>
      const form = document.getElementById("ingest");
      const formError = document.getElementById("form-error");
      const tableWrap = document.getElementById("table-wrap");
      const countEl = document.getElementById("count");
      document.getElementById("transaction_id").value =
        "txn_" + Math.random().toString(36).slice(2, 10);

      function fmt(value) {
        return value ? value.replace("T", " ").replace("Z", " UTC") : "—";
      }

      async function loadHistory() {
        const res = await fetch("/v1/transactions");
        if (!res.ok) throw new Error("Could not load history");
        const rows = await res.json();
        countEl.textContent = rows.length ? rows.length + " recent" : "No transactions yet";
        if (!rows.length) {
          tableWrap.innerHTML = '<p class="empty">No webhook events stored yet.</p>';
          return;
        }
        tableWrap.innerHTML =
          "<table><thead><tr>" +
          "<th>ID</th><th>From</th><th>To</th><th>Amount</th><th>Status</th><th>Created</th><th>Processed</th>" +
          "</tr></thead><tbody>" +
          rows
            .map(
              (r) =>
                "<tr>" +
                '<td class="mono">' + r.transaction_id + "</td>" +
                '<td class="mono">' + r.source_account + "</td>" +
                '<td class="mono">' + r.destination_account + "</td>" +
                "<td>" + r.amount + " " + r.currency + "</td>" +
                '<td><span class="badge ' + r.status + '">' + r.status + "</span></td>" +
                "<td>" + fmt(r.created_at) + "</td>" +
                "<td>" + fmt(r.processed_at) + "</td>" +
                "</tr>"
            )
            .join("") +
          "</tbody></table>";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        formError.hidden = true;
        const payload = {
          transaction_id: form.transaction_id.value.trim(),
          source_account: form.source_account.value.trim(),
          destination_account: form.destination_account.value.trim(),
          amount: Number(form.amount.value),
          currency: form.currency.value.trim(),
        };
        form.querySelector("button").disabled = true;
        try {
          const res = await fetch("/v1/webhooks/transactions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          if (res.status !== 202) {
            const body = await res.text();
            throw new Error(body || "Webhook was not accepted");
          }
          form.transaction_id.value = "txn_" + Math.random().toString(36).slice(2, 10);
          await loadHistory();
        } catch (err) {
          formError.hidden = false;
          formError.textContent = err.message;
        } finally {
          form.querySelector("button").disabled = false;
        }
      });

      loadHistory().catch((err) => {
        countEl.textContent = "Error";
        tableWrap.innerHTML = '<p class="error">' + err.message + "</p>";
      });
      setInterval(() => {
        loadHistory().catch(() => {});
      }, 3000);
    </script>
  </body>
</html>
